# Set scroll history to 100,000 lines
set-option -g history-limit 100000

# Bind prefix to Ctrl-s
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Start windows and panes at index 1
set -g base-index 1
setw -g pane-base-index 1

# Disable ESC delay
set -s escape-time 0

# Enable title bar
set -g set-titles on
set -g set-titles-string "#T"

# Enable vi mode
set -g mode-keys vi

# Set vi as the default editor
set -g status-keys vi

# Enable vi copy
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe 'xclip -in -selection clipboard &> /dev/null'
bind -T copy-mode-vi Enter send-keys -X cancel

# Split panes with | and -
bind | split-window -h
bind - split-window -v

# Move between panes with vi keys
bind -r ^ last-window
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Create a new session
bind-key -r f run-shell "tmux neww tmux_new_session.sh"
bind-key -r i run-shell "tmux neww tmux_switch_session.sh"

# Clear scroll history
bind C-k clear-history

# Enable mouse
set -g mouse on

# Remove date/time region 
set -g status-right ''
set -g status-right-length 0

# Set the length of the displayed session name
set -g status-left-length 25

# Renumber windows sequentially when one is closed
set -g renumber-windows on

set -g default-terminal screen-256color

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'uhs-robert/tmux-oasis'
set -g @oasis_flavor "cactus_light_1"
set -g @oasis_mode_format  "icon"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
